    <style>
      :root {
        --bg: #eef3ff;
        --bg2: #f7fafc;
        --panel: rgba(255, 255, 255, 0.8);
        --panel-muted: rgba(241, 246, 255, 0.85);
        --text: #0f172a;
        --subtext: #4b5563;
        --line: rgba(102, 118, 148, 0.25);
        --primary: #0b7a75;
        --primary-2: #0ea5e9;
        --danger: #c62828;
        --warn: #ca8a04;
        --ring: rgba(14, 165, 233, 0.24);
      }
      body.theme-dark {
        --bg: #071022;
        --bg2: #0b172f;
        --panel: rgba(15, 27, 48, 0.72);
        --panel-muted: rgba(20, 36, 63, 0.78);
        --text: #e9efff;
        --subtext: #9eb0cb;
        --line: rgba(84, 112, 154, 0.32);
        --primary: #2dd4bf;
        --primary-2: #38bdf8;
        --danger: #f87171;
        --warn: #fbbf24;
        --ring: rgba(45, 212, 191, 0.24);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Noto Sans KR", sans-serif;
        background:
          radial-gradient(1200px 620px at 0% -8%, #d7e4ff 0%, transparent 58%),
          radial-gradient(1200px 620px at 100% -15%, #ccfbf1 0%, transparent 56%),
          linear-gradient(180deg, var(--bg), var(--bg2));
        color: var(--text);
      }
      body.theme-dark {
        background:
          radial-gradient(1200px 620px at 0% -8%, #12305a 0%, transparent 58%),
          radial-gradient(1200px 620px at 100% -15%, #0a3a34 0%, transparent 56%),
          linear-gradient(180deg, var(--bg), var(--bg2));
      }
      .app-shell {
        position: relative;
        z-index: 1;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow:
          0 10px 32px rgba(15, 23, 42, 0.06),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
        transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      }
      .panel:hover {
        transform: translateY(-1px);
        box-shadow:
          0 14px 38px rgba(15, 23, 42, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }
      .panel-muted {
        background: var(--panel-muted);
        border: 1px solid var(--line);
      }
      .subtext {
        color: var(--subtext);
      }
      .text-main {
        color: var(--text);
      }
      .primary {
        color: var(--primary);
      }
      .btn-primary {
        background: linear-gradient(120deg, var(--primary), var(--primary-2));
        color: #fff;
        border: 0;
        box-shadow: 0 8px 22px rgba(14, 165, 233, 0.28);
        transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        filter: brightness(1.04);
        box-shadow: 0 12px 24px rgba(14, 165, 233, 0.34);
      }
      .btn-secondary {
        background: var(--panel-muted);
        border: 1px solid var(--line);
        color: var(--text);
        transition: all 0.16s ease;
      }
      .btn-secondary:hover {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px var(--ring);
      }
      .btn-danger {
        background: rgba(220, 38, 38, 0.12);
        border: 1px solid rgba(220, 38, 38, 0.35);
        color: #dc2626;
      }
      .kpi-card {
        position: relative;
        overflow: hidden;
      }
      .kpi-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--primary), var(--primary-2));
      }
      .title-gradient {
        background: linear-gradient(135deg, #0f766e, #0369a1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
      }
      body.theme-dark .title-gradient {
        background: linear-gradient(135deg, #2dd4bf, #38bdf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .form-control {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.82);
        color: var(--text);
        outline: 0;
        transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
      }
      body.theme-dark .form-control {
        background: rgba(9, 16, 29, 0.65);
      }
      .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px var(--ring);
      }
      .metric-number {
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1, "lnum" 1;
        letter-spacing: -0.01em;
      }
      .metric-lg {
        font-size: clamp(1.2rem, 1.2vw + 0.9rem, 1.85rem);
        line-height: 1.15;
      }
      .metric-md {
        font-size: 1.02rem;
        font-weight: 700;
      }
      .section-title {
        font-size: 1.06rem;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .tone-core {
        color: #0f766e;
      }
      .tone-sim {
        color: #0369a1;
      }
      .tone-forecast {
        color: #7c3aed;
      }
      .tone-productivity {
        color: #166534;
      }
      .tone-analytics {
        color: #b45309;
      }
      body.theme-dark .tone-core {
        color: #2dd4bf;
      }
      body.theme-dark .tone-sim {
        color: #38bdf8;
      }
      body.theme-dark .tone-forecast {
        color: #c4b5fd;
      }
      body.theme-dark .tone-productivity {
        color: #86efac;
      }
      body.theme-dark .tone-analytics {
        color: #fbbf24;
      }
      table {
        border-collapse: separate;
        border-spacing: 0;
      }
      th {
        color: var(--subtext);
        font-weight: 700;
        background: rgba(148, 163, 184, 0.08);
      }
      th,
      td {
        padding: 10px 10px;
      }
      tbody tr {
        transition: background 0.16s ease;
      }
      tbody tr:hover {
        background: rgba(148, 163, 184, 0.1);
      }
      .app-header {
        position: sticky;
        top: 12px;
        z-index: 20;
      }
      .fade-in {
        animation: fadeUp 0.5s ease both;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 4px solid #d1d5db;
        border-top-color: var(--primary);
        border-radius: 999px;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media print {
        body {
          background: #fff !important;
          color: #000 !important;
          font-size: 11pt;
        }
        .no-print {
          display: none !important;
        }
        .panel {
          border: 1px solid #cbd5e1 !important;
          box-shadow: none !important;
          background: #fff !important;
        }
        .print-break {
          break-inside: avoid;
          page-break-inside: avoid;
        }
      }

    <script type="text/babel">
      const { useEffect, useMemo, useRef, useState } = React;

      const SHARED_COLLECTION = "global_shared_data";
      const HR_MANAGER_SOURCE_SEGMENTS = ["artifacts", "hr-manager-6635c", "public", "data", "employees"];
      const HR_MANAGER_SOURCE_PATH = HR_MANAGER_SOURCE_SEGMENTS.join("/");

      const DEFAULT_SETTINGS = {
        annualRevenue: 12000000000,
        warningLaborRatio: 20,
      };

      const DEFAULT_SCENARIO = {
        headcountChange: 0,
        promotionRaiseRate: 3,
        minWageRaiseRate: 2,
        bonusAdjustRate: 0,
        incentivePayoutRate: 100,
        fourHalfDayAdjustRate: -10,
        avgRaiseRate: 4,
      };

      const DEFAULT_FORECAST = {
        annualRaiseRate: 4,
        revenueGrowthRate: 5,
        hireY1: 5,
        hireY2: 5,
        hireY3: 3,
        retireY1: 2,
        retireY2: 2,
        retireY3: 3,
      };

      const DEFAULT_PRODUCTIVITY = {
        annualProduction: 100000,
        productivityPerPerson: 1800,
        overtimeHours: 4000,
      };

      const formatNumber = (v) => Number(v || 0).toLocaleString("ko-KR");
      const roundToManwon = (v) => Math.round((Number(v) || 0) / 10000) * 10000;
      const formatCurrency = (v) =>
        `₩${Number(v || 0).toLocaleString("ko-KR", { maximumFractionDigits: 0 })}`;
      const formatCurrencyManwon = (v) =>
        `₩${roundToManwon(v).toLocaleString("ko-KR", { maximumFractionDigits: 0 })}`;
      const formatPercent = (v) => `${Number(v || 0).toFixed(2)}%`;
      const formatCurrencyShort = (v) => {
        const n = Number(v || 0);
        const abs = Math.abs(n);
        if (abs >= 100000000) return `₩${(n / 100000000).toFixed(1)}억`;
        if (abs >= 10000) return `₩${(n / 10000).toFixed(1)}만`;
        return formatCurrency(n);
      };

      const safeNumber = (v) => {
        const n = Number(v);
        return Number.isFinite(n) ? n : 0;
      };
      const annualFromMonthly = (monthly) => safeNumber(monthly) * 12;
      const parseHrMoney = (v) => {
        if (v === null || v === undefined || v === "") return 0;
        if (typeof v === "number") {
          if (!Number.isFinite(v)) return 0;
          // HR 원천값이 '만원 단위'(예: 5300)로 들어오는 경우를 원 단위로 보정
          if (v > 0 && v < 1000000) return v * 10000;
          return v;
        }
        const raw = String(v).trim();
        if (!raw) return 0;
        const cleaned = raw.replace(/,/g, "").replace(/\s/g, "");
        const numeric = Number(cleaned.replace(/[^\d.-]/g, ""));
        if (!Number.isFinite(numeric)) return 0;
        if (cleaned.includes("억")) return numeric * 100000000;
        if (cleaned.includes("만원") || cleaned.includes("만")) return numeric * 10000;
        if (numeric > 0 && numeric < 1000000) return numeric * 10000;
        return numeric;
      };
      const parseHrMonthlyBase = (row) => {
        const explicitMonthly =
          row.monthlyBaseSalary ??
          row.baseSalaryMonthly ??
          row.monthBaseSalary ??
          row.monthlySalary;
        if (explicitMonthly !== undefined && explicitMonthly !== null && explicitMonthly !== "") {
          return parseHrMoney(explicitMonthly);
        }

        const explicitAnnual =
          row.annualBaseSalary ??
          row.annualSalary ??
          row.yearSalary ??
          row.salary ??
          row.basePay;
        if (explicitAnnual !== undefined && explicitAnnual !== null && explicitAnnual !== "") {
          const annual = parseHrMoney(explicitAnnual);
          return Math.round(annual / 12);
        }

        const fallback = parseHrMoney(row.baseSalary);
        return fallback >= 10000000 ? Math.round(fallback / 12) : Math.round(fallback);
      };

      const calcEmployeeTotal = (emp) => {
        const annualBase = annualFromMonthly(emp.baseSalary);
        const wage =
          annualBase +
          safeNumber(emp.fixedAllowance) +
          safeNumber(emp.bonus) +
          safeNumber(emp.performancePay);
        const total = wage + safeNumber(emp.insuranceEmployer) + safeNumber(emp.retirementProvision);
        return Math.max(total, 0);
      };

      class ErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { hasError: false, errorMessage: "" };
        }
        static getDerivedStateFromError(error) {
          return { hasError: true, errorMessage: error?.message || "알 수 없는 오류가 발생했습니다." };
        }
        componentDidCatch(error, info) {
          console.error("ErrorBoundary caught error:", error, info);
        }
        render() {
          if (this.state.hasError) {
            return (
              <div className="min-h-screen flex items-center justify-center p-6">
                <div className="panel rounded-2xl max-w-xl w-full p-8 text-center shadow-xl">
                  <i className="fa-solid fa-triangle-exclamation text-4xl text-red-500 mb-4"></i>
                  <h1 className="text-2xl font-bold mb-3">화면 오류가 발생했습니다</h1>
                  <p className="subtext mb-6 break-words">{this.state.errorMessage}</p>
                  <button
                    className="btn-primary px-5 py-2 rounded-lg font-semibold"
                    onClick={() => window.location.reload()}
                  >
                    새로고침
                  </button>
                </div>
              </div>
            );
          }
          return this.props.children;
        }
      }

      function Spinner({ label }) {
        return (
          <div className="flex items-center justify-center flex-col gap-3 py-16">
            <div className="spinner"></div>
            <div className="subtext">{label || "로딩 중..."}</div>
          </div>
        );
      }

      function Toast({ toast, onClose }) {
        useEffect(() => {
          if (!toast) return;
          const timer = setTimeout(onClose, 2200);
          return () => clearTimeout(timer);
        }, [toast, onClose]);
        if (!toast) return null;
        return (
          <div className="fixed z-50 right-4 top-4">
            <div className="panel rounded-xl px-4 py-3 shadow-xl flex items-center gap-3">
              <i
                className={`fa-solid ${
                  toast.type === "error" ? "fa-circle-xmark text-red-500" : "fa-circle-check text-emerald-500"
                }`}
              ></i>
              <div className="text-sm">{toast.message}</div>
            </div>
          </div>
        );
      }

      function ConfirmModal({ open, title, message, onConfirm, onCancel }) {
        if (!open) return null;
        return (
          <div className="fixed inset-0 z-40 bg-black/40 flex items-center justify-center p-4">
            <div className="panel rounded-2xl p-6 w-full max-w-md shadow-2xl">
              <h3 className="font-bold text-lg mb-2">{title}</h3>
              <p className="subtext mb-5">{message}</p>
              <div className="flex justify-end gap-2">
                <button className="btn-secondary px-4 py-2 rounded-xl" onClick={onCancel}>
                  취소
                </button>
                <button className="px-4 py-2 rounded-xl bg-red-600 text-white" onClick={onConfirm}>
                  삭제
                </button>
              </div>
            </div>
          </div>
        );
      }

      function KPI({ icon, label, value, tone }) {
        const toneClass = tone === "danger" ? "text-red-500" : tone === "warn" ? "text-amber-500" : "primary";
        return (
          <div className="panel kpi-card rounded-2xl p-4 shadow-sm fade-in">
            <div className="text-xs subtext mb-2">{label}</div>
            <div className="flex items-center justify-between">
              <div className={`metric-number metric-lg font-extrabold ${toneClass}`}>{value}</div>
              <i className={`${icon} ${toneClass}`}></i>
            </div>
          </div>
        );
      }

      function App() {
        const [theme, setTheme] = useState(localStorage.getItem("theme") || "light");
        const [firebaseReady, setFirebaseReady] = useState(!!window.FirebaseServices);
        const [services, setServices] = useState(window.FirebaseServices || null);
        const [loading, setLoading] = useState(true);
        const [uid, setUid] = useState("");
        const [toast, setToast] = useState(null);

        const [employees, setEmployees] = useState([]);
        const [settings, setSettings] = useState(DEFAULT_SETTINGS);
        const [scenario, setScenario] = useState(DEFAULT_SCENARIO);
        const [forecastInput, setForecastInput] = useState(DEFAULT_FORECAST);
        const [productivity, setProductivity] = useState(DEFAULT_PRODUCTIVITY);
        const [logs, setLogs] = useState([]);

        const [employeeModal, setEmployeeModal] = useState({ open: false, mode: "create", target: null });
        const [deleteTarget, setDeleteTarget] = useState(null);
        const defaultsEnsuredRef = useRef(false);

        const compositionChartRef = useRef(null);
        const gradeChartRef = useRef(null);
        const compareChartRef = useRef(null);
        const forecastChartRef = useRef(null);
        const compositionChart = useRef(null);
        const gradeChart = useRef(null);
        const compareChart = useRef(null);
        const forecastChart = useRef(null);
        const chartPalette = useMemo(
          () =>
            theme === "dark"
              ? {
                  text: "#dbe7ff",
                  grid: "rgba(148,163,184,0.2)",
                  axis: "#9eb0cb",
                  pie: ["#38bdf8", "#34d399", "#fbbf24", "#a78bfa", "#fb7185", "#2dd4bf"],
                  bar: "#2dd4bf",
                  compare: ["#38bdf8", "#fb7185"],
                  lineA: "#38bdf8",
                  lineAFill: "rgba(56,189,248,0.18)",
                  lineB: "#f59e0b",
                  lineBFill: "rgba(245,158,11,0.2)",
                }
              : {
                  text: "#1f2937",
                  grid: "rgba(148,163,184,0.25)",
                  axis: "#475569",
                  pie: ["#0284c7", "#16a34a", "#d97706", "#7c3aed", "#dc2626", "#0f766e"],
                  bar: "#0f766e",
                  compare: ["#0284c7", "#dc2626"],
                  lineA: "#0284c7",
                  lineAFill: "rgba(2,132,199,0.16)",
                  lineB: "#d97706",
                  lineBFill: "rgba(217,119,6,0.18)",
                },
          [theme]
        );

        useEffect(() => {
          document.body.classList.toggle("theme-dark", theme === "dark");
          document.body.classList.toggle("theme-light", theme !== "dark");
          localStorage.setItem("theme", theme);
        }, [theme]);

        useEffect(() => {
          if (window.FirebaseServices) {
            setFirebaseReady(true);
            setServices(window.FirebaseServices);
            return;
          }
          const handler = () => {
            setFirebaseReady(true);
            setServices(window.FirebaseServices);
          };
          window.addEventListener("firebase-ready", handler);
          return () => window.removeEventListener("firebase-ready", handler);
        }, []);

        useEffect(() => {
          if (!firebaseReady || !services) return;
          const { auth, fns } = services;
          let unSubData = null;
          let unSubHr = null;
          const unSubAuth = fns.onAuthStateChanged(auth, async (user) => {
            try {
              if (!user) {
                await fns.signInAnonymously(auth);
                return;
              }
              setUid(user.uid);
              const colRef = fns.collection(services.db, SHARED_COLLECTION);
              const q = fns.query(colRef);
              unSubData = fns.onSnapshot(
                q,
                async (snapshot) => {
                  const nextEmployees = [];
                  let nextSettings = null;
                  let nextScenario = null;
                  let nextForecast = null;
                  let nextProductivity = null;
                  const nextLogs = [];

                  snapshot.forEach((d) => {
                    const data = d.data();
                    if (data.type === "employee") {
                      nextEmployees.push({ id: d.id, ...data });
                    } else if (d.id === "settings_main") {
                      nextSettings = { ...DEFAULT_SETTINGS, ...data };
                    } else if (d.id === "scenario_main") {
                      nextScenario = { ...DEFAULT_SCENARIO, ...data };
                    } else if (d.id === "forecast_main") {
                      nextForecast = { ...DEFAULT_FORECAST, ...data };
                    } else if (d.id === "productivity_main") {
                      nextProductivity = { ...DEFAULT_PRODUCTIVITY, ...data };
                    } else if (data.type === "log") {
                      nextLogs.push({ id: d.id, ...data });
                    }
                  });

                  setEmployees(
                    nextEmployees.sort((a, b) =>
                      String(a.name || "").localeCompare(String(b.name || "")) ||
                      String(a.department || "").localeCompare(String(b.department || ""))
                    )
                  );
                  setSettings(nextSettings || DEFAULT_SETTINGS);
                  setScenario(nextScenario || DEFAULT_SCENARIO);
                  setForecastInput(nextForecast || DEFAULT_FORECAST);
                  setProductivity(nextProductivity || DEFAULT_PRODUCTIVITY);
                  setLogs(
                    nextLogs
                      .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0))
                      .slice(0, 10)
                  );
                  setLoading(false);

                  if (!defaultsEnsuredRef.current) {
                    defaultsEnsuredRef.current = true;
                    await ensureDefaultDocs({
                      fns: services.fns,
                      db: services.db,
                      hasSettings: !!nextSettings,
                      hasScenario: !!nextScenario,
                      hasForecast: !!nextForecast,
                      hasProductivity: !!nextProductivity,
                    });
                  }
                },
                (error) => {
                  console.error(error);
                  setToast({ type: "error", message: "데이터 동기화 실패: Firestore 보안 규칙을 확인하세요." });
                  setLoading(false);
                }
              );

              // HR manager 프로젝트의 employees 경로를 실시간 연동합니다.
              try {
                if (services.hrAuth) await fns.signInAnonymously(services.hrAuth);
              } catch (error) {
                console.warn("HR manager 익명 인증 실패(보안규칙 확인 필요):", error);
              }
              const hrQ = fns.query(fns.collection(services.hrDb, ...HR_MANAGER_SOURCE_SEGMENTS));
              unSubHr = fns.onSnapshot(
                hrQ,
                async (snapshot) => {
                  try {
                    const tasks = snapshot.docs.map((d) => {
                      const x = d.data() || {};
                      const mapped = {
                        type: "employee",
                        source: "hr_manager",
                        sourcePath: HR_MANAGER_SOURCE_PATH,
                        sourceDocId: d.id,
                        name: x.name || x.employeeName || x.empName || x.userName || "이름없음",
                        department: x.department || x.dept || x.team || "미지정",
                        grade: x.grade || x.position || x.rank || x.jobTitle || "미지정",
                        employmentType: x.employmentType || x.contractType || x.employment || "정규직",
                        baseSalary: parseHrMonthlyBase(x),
                        fixedAllowance: parseHrMoney(x.fixedAllowance ?? x.allowance),
                        bonus: parseHrMoney(x.bonus),
                        performancePay: parseHrMoney(x.performancePay ?? x.incentive),
                        insuranceEmployer: parseHrMoney(x.insuranceEmployer ?? x.insurance),
                        retirementProvision: parseHrMoney(x.retirementProvision ?? x.retirement),
                      };
                      return fns.setDoc(
                        fns.doc(services.db, SHARED_COLLECTION, `hr_${d.id}`),
                        { ...mapped, updatedAt: fns.serverTimestamp() },
                        { merge: true }
                      );
                    });
                    await Promise.all(tasks);
                  } catch (error) {
                    console.warn("HR manager 연동 반영 실패:", error);
                  }
                },
                (error) => {
                  console.warn("HR manager 스냅샷 실패:", error);
                }
              );
            } catch (error) {
              console.error(error);
              setToast({ type: "error", message: "인증 중 오류가 발생했습니다." });
              setLoading(false);
            }
          });

          return () => {
            if (unSubData) unSubData();
            if (unSubHr) unSubHr();
            unSubAuth();
          };
        }, [firebaseReady, services]);

        const totalPeople = employees.length;
        const totalLaborCost = useMemo(
          () => employees.reduce((acc, emp) => acc + calcEmployeeTotal(emp), 0),
          [employees]
        );
        const avgCostPerPerson = totalPeople ? totalLaborCost / totalPeople : 0;
        const laborRatio = settings.annualRevenue ? (totalLaborCost / settings.annualRevenue) * 100 : 0;

        const scenarioResult = useMemo(() => {
          const pct = (x) => safeNumber(x) / 100;
          const salaryFactor =
            1 +
            pct(scenario.avgRaiseRate) +
            pct(scenario.minWageRaiseRate) +
            pct(scenario.promotionRaiseRate) +
            pct(scenario.fourHalfDayAdjustRate);
          const bonusFactor = 1 + pct(scenario.bonusAdjustRate);
          const incentiveFactor = pct(scenario.incentivePayoutRate);

          const simulatedExistingCost = employees.reduce((sum, emp) => {
            const base = annualFromMonthly(emp.baseSalary);
            const allowance = safeNumber(emp.fixedAllowance);
            const bonus = safeNumber(emp.bonus) * bonusFactor;
            const incentive = safeNumber(emp.performancePay) * incentiveFactor;
            const insurance = safeNumber(emp.insuranceEmployer) * Math.max(salaryFactor, 0.1);
            const retirement = safeNumber(emp.retirementProvision) * Math.max(salaryFactor, 0.1);
            return sum + (base + allowance) * salaryFactor + bonus + incentive + insurance + retirement;
          }, 0);

          const additionalHeadcountCost = avgCostPerPerson * safeNumber(scenario.headcountChange);
          const total = simulatedExistingCost + additionalHeadcountCost;
          const delta = total - totalLaborCost;
          const deltaRate = totalLaborCost ? (delta / totalLaborCost) * 100 : 0;
          const ebitdaImpact = -delta;
          const ratio = settings.annualRevenue ? (total / settings.annualRevenue) * 100 : 0;

          return { total, delta, deltaRate, ebitdaImpact, ratio };
        }, [employees, scenario, settings.annualRevenue, avgCostPerPerson, totalLaborCost]);

        const forecastRows = useMemo(() => {
          const rows = [];
          let people = totalPeople;
          let avgCost = avgCostPerPerson || 1;
          let revenue = safeNumber(settings.annualRevenue);
          const raiseRate = safeNumber(forecastInput.annualRaiseRate) / 100;
          const revenueGrowthRate = safeNumber(forecastInput.revenueGrowthRate) / 100;
          for (let i = 1; i <= 3; i++) {
            const hire = safeNumber(forecastInput[`hireY${i}`]);
            const retire = safeNumber(forecastInput[`retireY${i}`]);
            people = Math.max(people + hire - retire, 0);
            avgCost = avgCost * (1 + raiseRate);
            revenue = revenue * (1 + revenueGrowthRate);
            const yearlyCost = people * avgCost;
            rows.push({
              yearLabel: `${new Date().getFullYear() + i}년`,
              people,
              yearlyCost,
              laborRatio: revenue ? (yearlyCost / revenue) * 100 : 0,
            });
          }
          return rows;
        }, [forecastInput, totalPeople, avgCostPerPerson, settings.annualRevenue]);

        const productivityResult = useMemo(() => {
          const production = safeNumber(productivity.annualProduction);
          const productivityPerPerson = Math.max(safeNumber(productivity.productivityPerPerson), 1);
          const overtime = safeNumber(productivity.overtimeHours);
          const overtimeAdj = 1 + (overtime / 2000) * 0.2;
          const required = Math.ceil(production / (productivityPerPerson * overtimeAdj));
          const gap = totalPeople - required;
          const excessCost = gap > 0 ? gap * avgCostPerPerson : 0;
          return { required, gap, excessCost };
        }, [productivity, totalPeople, avgCostPerPerson]);

        const departmentTop5 = useMemo(() => {
          const m = {};
          employees.forEach((e) => {

            m[dept] = (m[dept] || 0) + calcEmployeeTotal(e);
          });
          return Object.entries(m)

            .sort((a, b) => b.cost - a.cost)
            .slice(0, 5);

        const gradeCostConcentration = useMemo(() => {
          const gradeMap = {};

          });
          const total = Object.values(gradeMap).reduce((a, b) => a + b, 0);
          return Object.entries(gradeMap)

              grade,

              share: total ? (cost / total) * 100 : 0,

        const autoCauseSummary = useMemo(() => {
          const contributions = [

            { label: "4.5일제 임금 조정", value: safeNumber(scenario.fourHalfDayAdjustRate) },
          ].sort((a, b) => Math.abs(b.value) - Math.abs(a.value));

          return `${top[0]?.label || "요인 없음"}과 ${top[1]?.label || "요인 없음"}이 인건비 변화의 핵심 동인입니다.`;
        }, [scenario]);

        const sensitivity = useMemo(() => {
          const baseRate = safeNumber(scenario.avgRaiseRate);

            clone.avgRaiseRate = rate;

            const salaryFactor =
              1 +
              pct(clone.avgRaiseRate) +
              pct(clone.minWageRaiseRate) +
              pct(clone.promotionRaiseRate) +
              pct(clone.fourHalfDayAdjustRate);
            const bonusFactor = 1 + pct(clone.bonusAdjustRate);
            const incentiveFactor = pct(clone.incentivePayoutRate);
            const simulatedExistingCost = employees.reduce((sum, emp) => {
              const base = annualFromMonthly(emp.baseSalary);
              const allowance = safeNumber(emp.fixedAllowance);
              const bonus = safeNumber(emp.bonus) * bonusFactor;
              const incentive = safeNumber(emp.performancePay) * incentiveFactor;
              const insurance = safeNumber(emp.insuranceEmployer) * Math.max(salaryFactor, 0.1);
              const retirement = safeNumber(emp.retirementProvision) * Math.max(salaryFactor, 0.1);
              return sum + (base + allowance) * salaryFactor + bonus + incentive + insurance + retirement;
            }, 0);
            return simulatedExistingCost + avgCostPerPerson * safeNumber(clone.headcountChange);
          };
          const minus1 = run(baseRate - 1);
          const plus1 = run(baseRate + 1);

                  <td style="padding:8px 10px;border-bottom:1px solid #e5e7eb;text-align:right;font-weight:700;">${formatCurrency(d.cost)}</td>

          return `
            <div style="font-family:'Noto Sans KR',sans-serif;color:#0f172a;line-height:1.55;">
              <div style="background:linear-gradient(135deg,#0f766e,#0369a1);padding:24px;border-radius:16px;color:#fff;margin-bottom:18px;">
                <div style="font-size:13px;opacity:.92;">Executive Report</div>
                <h2 style="font-size:28px;margin:6px 0 4px;font-weight:900;">2026년 인건비 시뮬레이션 결과 보고서</h2>
                <div style="font-size:13px;opacity:.92;">생성일: ${new Date().toLocaleString("ko-KR")}</div>
              </div>

              <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px;">
                <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;">
                  <div style="font-size:12px;color:#64748b;">총 인원</div>
                  <div style="font-size:22px;font-weight:900;">${formatNumber(totalPeople)}명</div>
                </div>
                <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;">
                  <div style="font-size:12px;color:#64748b;">총 인건비</div>
                  <div style="font-size:22px;font-weight:900;">${formatCurrency(totalLaborCost)}</div>

                  <div style="font-size:12px;color:#64748b;">인건비율</div>

              <div style="background:#ffffff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:12px;">
                <h3 style="margin:0 0 10px;font-size:16px;">1. 시나리오 영향 요약</h3>

                  <li>인건비율 임계치(20%) 초과 전 채용/보상 정책을 선제 조정합니다.</li>

        useEffect(() => {

            options: {

                  borderWidth: 1,

        useEffect(() => {

          gradeChart.current = new Chart(gradeChartRef.current, {

            data: {
              labels: gradeCostConcentration.map((x) => x.grade),
              datasets: [
                {
                  label: "직급별 비용",
                  data: gradeCostConcentration.map((x) => x.cost),
                  backgroundColor: chartPalette.bar,
                  borderRadius: 10,
                  maxBarThickness: 34,

            },
            options: {
              responsive: true,
              plugins: {
                legend: { display: false },
                tooltip: {
                  backgroundColor: theme === "dark" ? "rgba(10,18,34,0.92)" : "rgba(255,255,255,0.96)",
                  titleColor: chartPalette.text,

        }, [gradeCostConcentration, chartPalette, theme]);

        useEffect(() => {

            options: {
              plugins: {

                tooltip: {
                  backgroundColor: theme === "dark" ? "rgba(10,18,34,0.92)" : "rgba(255,255,255,0.96)",
                  titleColor: chartPalette.text,
                  bodyColor: chartPalette.text,
                  borderColor: theme === "dark" ? "rgba(56,189,248,0.3)" : "rgba(2,132,199,0.25)",
                  borderWidth: 1,
                  padding: 12,
                  cornerRadius: 10,
                  callbacks: {
                    label: (ctx) => `${ctx.label}: ${formatCurrency(ctx.parsed.y)}`,
                    footer: (items) => {
                      const picked = items[0];
                      if (!picked) return "";
                      const base = totalLaborCost;
                      const current = picked.parsed.y;
                      const delta = current - base;
                      if (picked.dataIndex === 0) return "기준값";
                      return `현재 대비 변화: ${formatCurrency(delta)} (${formatPercent(
                        base ? (delta / base) * 100 : 0
                      )})`;
                    },
                  },
                },
              },
              scales: {
                y: {
                  beginAtZero: true,
                  grid: { color: chartPalette.grid },
                  ticks: { color: chartPalette.axis, callback: (v) => formatCurrencyShort(v) },
                },
                x: { grid: { display: false }, ticks: { color: chartPalette.axis } },
              },
            },
          });

        useEffect(() => {

            type: "line",
            data: {
              labels: forecastRows.map((r) => r.yearLabel),
              datasets: [

                  label: "3년 인건비 추이",

                  borderColor: chartPalette.lineA,
                  backgroundColor: chartPalette.lineAFill,
                  tension: 0.35,
                  pointRadius: 3,
                  pointHoverRadius: 5,
                  fill: true,
                },
                {
                  label: "인건비율(%)",
                  data: forecastRows.map((r) => r.laborRatio),
                  borderColor: chartPalette.lineB,
                  backgroundColor: chartPalette.lineBFill,
                  tension: 0.35,
                  pointRadius: 3,
                  pointHoverRadius: 5,
                  yAxisID: "y1",
                },
              ],
            },
            options: {
              interaction: { mode: "index", intersect: false },
              plugins: {
                legend: { labels: { color: chartPalette.text, font: { family: "Noto Sans KR", weight: "700" } } },
                tooltip: {
                  backgroundColor: theme === "dark" ? "rgba(10,18,34,0.92)" : "rgba(255,255,255,0.96)",
                  titleColor: chartPalette.text,
                  bodyColor: chartPalette.text,
                  footerColor: chartPalette.axis,
                  borderColor: theme === "dark" ? "rgba(56,189,248,0.3)" : "rgba(2,132,199,0.25)",
                  borderWidth: 1,
                  padding: 12,
                  cornerRadius: 10,
                  callbacks: {
                    title: (items) => `${items[0]?.label || ""} 전망`,
                    label: (ctx) => {
                      if (ctx.datasetIndex === 0) return `인건비: ${formatCurrency(ctx.parsed.y)} (${formatCurrencyShort(ctx.parsed.y)})`;
                      return `인건비율: ${formatPercent(ctx.parsed.y)}`;
                    },
                    footer: (items) => {
                      if (!items.length) return "";
                      const first = items.find((i) => i.datasetIndex === 0) || items[0];
                      const idx = first.dataIndex;
                      if (idx <= 0) return "전년 대비: 기준 연도";
                      const prev = forecastRows[idx - 1]?.yearlyCost || 0;
                      const curr = forecastRows[idx]?.yearlyCost || 0;
                      const delta = curr - prev;
                      const ratio = prev ? (delta / prev) * 100 : 0;
                      const sign = delta >= 0 ? "+" : "";
                      return `전년 대비: ${sign}${formatCurrency(delta)} (${sign}${formatPercent(ratio)})`;
                    },
                  },
                },
              },
              scales: {
                x: { ticks: { color: chartPalette.axis }, grid: { display: false } },
                y: {
                  beginAtZero: true,
                  ticks: { color: chartPalette.axis, callback: (v) => formatCurrencyShort(v) },
                  grid: { color: chartPalette.grid },
                },
                y1: {
                  position: "right",
                  beginAtZero: true,
                  ticks: { color: chartPalette.axis, callback: (v) => `${Number(v).toFixed(1)}%` },
                  grid: { drawOnChartArea: false },
                },
              },
            },
          });

        const saveDoc = async (id, data, successMessage) => {

        const addLog = async (action, detail) => {
          try {
            const { fns, db } = services;
            await fns.addDoc(fns.collection(db, SHARED_COLLECTION), {
              type: "log",
              action,
              detail,
              actor: uid || "anonymous",
              createdAt: fns.serverTimestamp(),

              </div>
              <div className="panel rounded-2xl p-4 md:p-5 shadow-sm">
                <h3 className="section-title tone-sim mb-2">시나리오 전후 비교</h3>
                <canvas ref={compareChartRef} height="220"></canvas>
              </div>
              <div className="panel rounded-2xl p-4 md:p-5 shadow-sm">
                <h3 className="section-title tone-forecast mb-2">3년 Forecast 그래프</h3>
                <canvas ref={forecastChartRef} height="220"></canvas>
              </div>
            </section>

            <section className="panel rounded-2xl p-4 md:p-5 shadow-sm print-break fade-in">
              <div className="flex items-center justify-between mb-3">
                <h2 className="section-title tone-core">자동 보고서 생성</h2>
                <button
                  className="btn-primary px-4 py-2 rounded-xl text-sm no-print"
                  onClick={() => {
                    const reportWin = window.open("", "_blank");
                    reportWin.document.write(`
                      <html>
                        <head>
                          <meta charset="utf-8">
                          <meta name="viewport" content="width=device-width, initial-scale=1.0">
                          <title>2026년 인건비 시뮬레이션 결과 보고서</title>
                          <style>
                            body{font-family:'Noto Sans KR',sans-serif;background:#f1f5f9;margin:0;padding:24px;color:#0f172a;}
                            .wrap{max-width:1100px;margin:0 auto;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(15,23,42,.08);}
                            @media print{body{background:#fff;padding:0}.wrap{box-shadow:none;border:none;padding:0}}
                          </style>
                        </head>
                        <body>
                          <div class="wrap">
                        ${reportHtml}
                          </div>
                        </body>
                      </html>
                    `);
                    reportWin.document.close();
                  }}
                >
                  <i className="fa-solid fa-file-lines mr-2"></i>보고서 출력
                </button>
              </div>
              <div
                className="panel-muted rounded-xl p-4 text-sm"
                dangerouslySetInnerHTML={{ __html: reportHtml }}
              />
            </section>

            <section className="panel rounded-2xl p-4 md:p-5 shadow-sm no-print fade-in">
              <h2 className="section-title tone-core mb-3">변경 이력(Log)</h2>
              <div className="space-y-2 text-sm">
                {logs.map((l) => (
                  <div key={l.id} className="panel-muted rounded-lg p-3 flex justify-between gap-2">
                    <span>
                      <b>{l.action}</b> - {l.detail}
                    </span>
                    <span className="subtext">
                      {l.createdAt?.seconds
                        ? new Date(l.createdAt.seconds * 1000).toLocaleString("ko-KR")
                        : "시간 미정"}
                    </span>
                  </div>
                ))}
                {!logs.length && <div className="subtext">아직 저장된 변경 이력이 없습니다.</div>}
              </div>
            </section>
          </div>
        );
      }

      function NumberInput({ label, value, onChange }) {
        const [local, setLocal] = useState(value ?? 0);
        useEffect(() => setLocal(value ?? 0), [value]);
        return (
          <label className="block">
            <div className="text-xs subtext mb-1">{label}</div>
            <input
              type="number"
              className="form-control"
              value={local}
              onChange={(e) => setLocal(e.target.value)}
              onBlur={() => onChange(safeNumber(local))}
            />
          </label>
        );
      }

      function EmployeeEditor({ data, onClose, onSave }) {
        const [form, setForm] = useState(
          data || {
            name: "",
            department: "",
            grade: "",
            employmentType: "정규직",
            baseSalary: 0,
            fixedAllowance: 0,
            bonus: 0,
            performancePay: 0,
            insuranceEmployer: 0,
            retirementProvision: 0,
          }
        );
        const setField = (k, v) => setForm((prev) => ({ ...prev, [k]: v }));
        return (
          <div className="fixed inset-0 z-40 bg-black/40 flex items-center justify-center p-4">
            <div className="panel rounded-2xl p-5 w-full max-w-3xl shadow-2xl">
              <div className="flex items-center justify-between mb-3">
                <h3 className="font-bold text-lg">{data ? "직원 정보 수정" : "직원 정보 추가"}</h3>
                <button className="btn-secondary px-3 py-1.5 rounded-lg" onClick={onClose}>
                  닫기
                </button>
              </div>
              <div className="grid md:grid-cols-2 gap-3">
                <TextInput label="이름" value={form.name || ""} onChange={(v) => setField("name", v)} />
                <TextInput label="부서" value={form.department} onChange={(v) => setField("department", v)} />
                <TextInput label="직급" value={form.grade} onChange={(v) => setField("grade", v)} />
                <SelectInput
                  label="고용형태"
                  value={form.employmentType}
                  onChange={(v) => setField("employmentType", v)}
                  options={["정규직", "계약직", "파견"]}
                />
                <NumberInput label="월 기본급" value={form.baseSalary} onChange={(v) => setField("baseSalary", v)} />
                <NumberInput label="고정수당" value={form.fixedAllowance} onChange={(v) => setField("fixedAllowance", v)} />
                <NumberInput label="상여금" value={form.bonus} onChange={(v) => setField("bonus", v)} />
                <NumberInput label="성과급" value={form.performancePay} onChange={(v) => setField("performancePay", v)} />
                <NumberInput label="4대보험 사용자 부담액" value={form.insuranceEmployer} onChange={(v) => setField("insuranceEmployer", v)} />
                <NumberInput label="퇴직충당금" value={form.retirementProvision} onChange={(v) => setField("retirementProvision", v)} />
              </div>
              <div className="panel-muted rounded-lg p-3 mt-3 text-sm">
                총연봉(자동계산, 월 기본급 x 12): <b>{formatCurrencyManwon(calcEmployeeTotal(form))}</b>
              </div>
              <div className="flex justify-end gap-2 mt-4">
                <button className="btn-secondary px-4 py-2 rounded-xl" onClick={onClose}>
                  취소
                </button>
                <button
                  className="btn-primary px-4 py-2 rounded-xl"
                  onClick={() => {
                    if (!form.name || !form.department || !form.grade) {
                      alert("이름/부서/직급을 입력하세요.");
                      return;
                    }
                    onSave(form, data?.id);
                  }}
                >
                  저장
                </button>
              </div>
            </div>
          </div>
        );
      }

      function TextInput({ label, value, onChange }) {
        return (
          <label className="block">
            <div className="text-xs subtext mb-1">{label}</div>
            <input
              type="text"
              className="form-control"
              value={value}
              onChange={(e) => onChange(e.target.value)}
            />
          </label>
        );
      }

      function SelectInput({ label, value, onChange, options }) {
        return (
          <label className="block">
            <div className="text-xs subtext mb-1">{label}</div>
            <select
              className="form-control"
              value={value}
              onChange={(e) => onChange(e.target.value)}
            >
              {options.map((o) => (
                <option key={o} value={o}>
                  {o}
                </option>
              ))}
            </select>
          </label>
        );
      }

      async function ensureDefaultDocs({ fns, db, hasSettings, hasScenario, hasForecast, hasProductivity }) {
        const jobs = [];
        if (!hasSettings) {
          jobs.push(
            fns.setDoc(
              fns.doc(db, SHARED_COLLECTION, "settings_main"),
              { type: "settings", ...DEFAULT_SETTINGS, createdAt: fns.serverTimestamp() },
              { merge: true }
            )
          );
        }
        if (!hasScenario) {
          jobs.push(
            fns.setDoc(
              fns.doc(db, SHARED_COLLECTION, "scenario_main"),
              { type: "scenario", ...DEFAULT_SCENARIO, createdAt: fns.serverTimestamp() },
              { merge: true }
            )
          );
        }
        if (!hasForecast) {
          jobs.push(
            fns.setDoc(
              fns.doc(db, SHARED_COLLECTION, "forecast_main"),
              { type: "forecast", ...DEFAULT_FORECAST, createdAt: fns.serverTimestamp() },
              { merge: true }
            )
          );
        }
        if (!hasProductivity) {
          jobs.push(
            fns.setDoc(
              fns.doc(db, SHARED_COLLECTION, "productivity_main"),
              { type: "productivity", ...DEFAULT_PRODUCTIVITY, createdAt: fns.serverTimestamp() },
              { merge: true }
            )
          );
        }
        await Promise.all(jobs);
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>
      );
    </script>
  </body>
</html>
